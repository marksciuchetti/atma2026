<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2545">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>AtMA 2026 · Nashville</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@500;600;700;800&family=Source+Serif+4:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
  :root{
    /* Palette drawn from the Atlantic Marketing Association logo (navy nautical blues)
       plus companion sea teal and sand gold accents for room coding. */
    --bg:#FBF2DF;
    --card:#FFFFFF;
    --tint:#F6EACC;
    --ink:#152B40;
    --ink-soft:#5A6B7C;
    --line:#E8DCBD;
    --navy:#1E4468;
    --blue:#2E77AC;
    --teal:#1F8A7D;
    --gold:#9A6E10;
    --gold-bright:#FFB53A;
    --grey:#8C8574;
    /* The AtMA site theme font is set inside Weebly files that automated tools
       cannot open, so the family below is the one line to change if the board
       standardizes on a specific typeface. */
    --brand:"Libre Franklin","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
    --utility:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--utility);
    font-size:16px;line-height:1.5;
    padding-bottom:calc(78px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:660px;margin:0 auto;padding:0 16px;position:relative;z-index:1}

  /* ---------- Masthead ---------- */
  header.bill{
    position:relative;overflow:hidden;
    background:
      radial-gradient(110% 80% at 88% -8%, rgba(255,181,58,.30) 0%, rgba(255,181,58,0) 55%),
      radial-gradient(90% 70% at -10% 112%, rgba(232,96,76,.20) 0%, rgba(232,96,76,0) 58%),
      linear-gradient(160deg,#0B2545 0%, var(--navy) 48%, #2F6FA8 82%, #4593D2 100%);
    color:#fff;text-align:center;padding:24px 16px 58px;
  }
  .bill .inner{position:relative;z-index:1}
  .logobox{
    display:inline-flex;align-items:center;justify-content:center;
    background:#fff;border:3px solid var(--gold-bright);border-radius:14px;
    padding:8px 16px;margin-bottom:12px;box-shadow:0 6px 18px rgba(6,20,38,.45);
  }
  .logobox .logo{height:60px;max-width:70vw;object-fit:contain;display:block}
  .logobox .monogram{display:none;font-family:var(--brand);font-weight:800;font-size:26px;letter-spacing:.01em;color:var(--navy);line-height:1.1;padding:4px 6px}
  .logobox .monogram::after{content:"";display:block;height:3px;border-radius:2px;background:var(--gold-bright);margin-top:4px}
  .logobox.noimg .logo{display:none}
  .logobox.noimg .monogram{display:block}
  .bill .assoc{font-family:var(--brand);font-weight:600;letter-spacing:.18em;text-transform:uppercase;font-size:11.5px;color:#C9DCEE}
  .bill h1{
    font-family:var(--brand);font-weight:800;
    font-size:clamp(26px,7vw,34px);line-height:1.12;letter-spacing:.01em;margin:5px 0 6px;color:#fff;
    text-shadow:0 1px 2px rgba(6,20,38,.35);
  }
  .bill .dates{font-family:var(--brand);font-weight:600;font-size:13.5px;color:#F5D98F}
  .bill .waves{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:80px;pointer-events:none;display:block}

  /* ---------- Sticky controls ---------- */
  .controls{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0 10px;box-shadow:0 8px 16px -14px rgba(21,43,64,.45)}
  .daytabs{display:flex;gap:8px}
  .daytab{
    flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);
    font-family:var(--brand);cursor:pointer;
    padding:7px 2px 6px;text-align:center;border-radius:10px;
  }
  .daytab .d{font-weight:700;font-size:14.5px;letter-spacing:.02em;display:block;line-height:1.1}
  .daytab .n{font-weight:500;font-size:11px;letter-spacing:.04em;color:var(--ink-soft);display:block;margin-top:2px}
  .daytab.on{background:linear-gradient(180deg,#FFC55C,var(--gold-bright));border-color:#E9A22F;color:var(--navy);box-shadow:0 2px 8px rgba(255,181,58,.45)}
  .daytab.on .n{color:#5C4708}
  .searchrow{display:flex;gap:8px;margin-top:9px}
  .searchrow input{
    flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;
    padding:9px 12px;font:15px var(--utility);color:var(--ink);
  }
  .searchrow input::placeholder{color:#93A3B2}
  .searchrow input:focus{outline:2px solid var(--blue);outline-offset:1px}
  .roomchips{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
  .chip{
    border:1px solid var(--line);background:var(--card);border-radius:999px;cursor:pointer;
    font-family:var(--brand);font-weight:600;letter-spacing:.03em;
    font-size:12px;padding:5px 12px;color:var(--ink-soft);
  }
  .chip::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--grey);vertical-align:1px}
  .chip.all::before{display:none}
  .chip.rA::before{background:var(--blue)}
  .chip.rB::before{background:var(--teal)}
  .chip.rC::before{background:var(--gold)}
  .chip.on{background:var(--navy);border-color:var(--navy);color:#fff}

  /* ---------- Session cards ---------- */
  .dayhead{font-family:var(--brand);font-weight:700;letter-spacing:.02em;font-size:14px;color:var(--ink-soft);margin:18px 2px 8px}
  .timehead{display:flex;align-items:center;gap:10px;margin:20px 2px 9px}
  .timehead .t{font-family:var(--brand);font-weight:700;letter-spacing:.04em;font-size:13.5px;color:var(--navy);white-space:nowrap;text-transform:uppercase}
  .timehead .l{flex:1;border-top:1px solid var(--line)}
  .timehead .t::before{content:"";display:inline-block;width:8px;height:8px;background:var(--gold-bright);border-radius:2px;margin-right:8px;transform:rotate(45deg)}
  .timehead .c{font-family:var(--brand);font-weight:600;font-size:11px;letter-spacing:.05em;color:var(--ink-soft);text-transform:uppercase;white-space:nowrap}
  .card{
    background:var(--card);border:1px solid var(--line);border-left:6px solid var(--grey);
    border-radius:12px;margin:0 0 10px;padding:13px 14px;position:relative;
    box-shadow:0 1px 2px rgba(21,43,64,.06);
  }
  .card.rA{border-left-color:var(--blue);background:linear-gradient(100deg,rgba(46,119,172,.11),#FFFFFF 48%)}
  .card.rB{border-left-color:var(--teal);background:linear-gradient(100deg,rgba(31,138,125,.11),#FFFFFF 48%)}
  .card.rC{border-left-color:var(--gold);background:linear-gradient(100deg,rgba(255,181,58,.16),#FFFFFF 48%)}
  .card .toprow{display:flex;align-items:flex-start;gap:8px}
  .card .code{font-family:var(--brand);font-weight:700;font-size:12px;letter-spacing:.05em;color:var(--ink-soft);text-transform:uppercase}
  .codechip{display:inline-block;background:var(--navy);color:#fff;font-weight:800;font-size:10.5px;letter-spacing:.06em;padding:2px 8px;border-radius:6px;margin-right:4px;vertical-align:1px}
  .card.rA .codechip{background:var(--blue);color:#fff}
  .card.rB .codechip{background:#187A6E;color:#fff}
  .card.rC .codechip{background:var(--gold-bright);color:var(--navy)}
  .card h3{font-family:var(--serif);font-weight:700;font-size:17.5px;line-height:1.3;margin:3px 0 5px;flex:1}
  .card .meta{font-family:var(--brand);font-weight:600;letter-spacing:.03em;font-size:12px;color:var(--ink-soft)}
  .card .meta .room{font-weight:700}
  .card.rA .room{color:var(--blue)} .card.rB .room{color:var(--teal)} .card.rC .room{color:var(--gold)}
  .room.roomlink{background:none;border:none;padding:0;font:inherit;color:inherit;letter-spacing:inherit;cursor:pointer;border-bottom:1.5px dotted currentColor}
  .room.roomlink:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
  .nowtag{display:inline-block;background:var(--gold-bright);color:var(--navy);font-family:var(--brand);font-weight:800;font-size:10px;letter-spacing:.1em;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:1px}
  .star{
    border:none;background:none;cursor:pointer;font-size:26px;line-height:1;color:#B9C6D2;
    padding:2px 2px 2px 8px;flex:none;
  }
  .star[aria-pressed="true"]{color:var(--gold-bright)}
  .star:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
  .expander{
    margin-top:8px;border:none;background:none;cursor:pointer;color:var(--blue);
    font-family:var(--brand);font-weight:700;letter-spacing:.04em;font-size:12.5px;padding:2px 0;
  }
  .expander:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .papers{margin-top:9px;border-top:1px solid var(--line);padding-top:4px}
  .paper{padding:9px 0;border-bottom:1px solid var(--tint)}
  .paper:last-child{border-bottom:none}
  .paper .pt{font-family:var(--serif);font-weight:700;font-size:15.5px;line-height:1.35}
  .paper .pa{font-size:13px;color:var(--ink-soft);margin-top:3px;line-height:1.45}
  .paper .ps{font-family:var(--brand);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:10px;color:#6B7C8C;margin-top:4px}
  .evt{background:var(--tint);border-style:solid;border-color:var(--line);border-left:4px solid var(--grey)}
  .empty{
    border:1.5px dashed var(--line);border-radius:12px;padding:28px 16px;text-align:center;color:var(--ink-soft);
    font-family:var(--utility);font-size:15px;margin-top:16px;background:var(--tint)
  }
  .btn{
    display:inline-block;border:1px solid var(--navy);background:linear-gradient(180deg,#3579B4 0%,var(--navy) 100%);color:#fff;
    font-family:var(--brand);font-weight:700;letter-spacing:.04em;
    font-size:13px;padding:10px 16px;border-radius:10px;cursor:pointer;text-decoration:none;text-align:center;
  }
  .btn.ghost{background:var(--card);color:var(--navy)}
  .btn:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

  /* ---------- Section headings ---------- */
  .sec{margin-top:26px}
  .sec > h2{
    font-family:var(--brand);font-weight:800;letter-spacing:.02em;color:var(--navy);
    font-size:17px;border-bottom:3px solid;border-image:linear-gradient(90deg,var(--gold-bright),#E8604C) 1;padding-bottom:5px;margin-bottom:10px
  }
  .sec > h2::before{content:"";display:inline-block;width:10px;height:10px;background:linear-gradient(135deg,var(--gold-bright),#E8604C);border-radius:3px;margin-right:8px;transform:rotate(45deg)}
  .note{font-size:13.5px;color:var(--ink-soft)}
  .prose{font-family:var(--serif);font-size:16px;line-height:1.6}
  .prose p{margin:0 0 12px}
  .kv{margin:8px 0 0}
  .kv .k{font-family:var(--brand);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:11px;color:var(--blue)}
  .kv .v{font-size:14.5px;margin:2px 0 11px}
  a{color:var(--blue)}

  /* ---------- Map ---------- */
  .mapbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 6px 2px;margin-top:10px;box-shadow:0 1px 2px rgba(21,43,64,.06)}
  #poiSvg{width:100%;height:auto;display:block}
  .poi-dot{cursor:pointer}
  .poi-dot circle.halo{fill:transparent}
  .poi-dot.sel circle.core{stroke:var(--gold-bright);stroke-width:3}
  .legend{list-style:none;margin-top:10px}
  .legend li{display:flex;gap:10px;align-items:baseline;padding:8px 4px;border-bottom:1px solid var(--tint);cursor:pointer;border-radius:8px;transition:background .12s ease}
  .legend li:hover{background:var(--tint)}
  .legend li:last-child{border-bottom:none}
  .legend .num{
    flex:none;width:20px;height:20px;border-radius:50%;color:#fff;text-align:center;
    font-family:var(--brand);font-weight:700;font-size:11.5px;line-height:20px;transform:translateY(3px)
  }
  .legend .nm{font-family:var(--serif);font-weight:700;font-size:15.5px}
  .legend .ds{font-family:var(--brand);font-weight:600;font-size:11px;letter-spacing:.04em;color:var(--ink-soft);margin-left:auto;white-space:nowrap}
  .poicard{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:13px;margin-top:10px;box-shadow:0 1px 2px rgba(21,43,64,.06)}
  .poicard h3{font-family:var(--serif);font-size:17px}
  .poicard .cat{font-family:var(--brand);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:10.5px;color:var(--ink-soft)}
  .poicard p{font-size:14px;margin-top:5px}
  .roomguide .rg{padding:9px 2px;border-bottom:1px solid var(--tint)}
  .roomguide .rg:last-child{border-bottom:none}
  .roomguide .rn{font-family:var(--serif);font-weight:700;font-size:15.5px}
  .roomguide .ru{font-size:13px;color:var(--ink-soft);margin-top:2px}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}

  /* ---------- Now banner + star animation ---------- */
  .nownext{
    border-left:5px solid var(--gold-bright);
    background:linear-gradient(135deg,var(--navy) 0%,#2F6FA8 100%);color:#fff;border-radius:12px;
    padding:11px 14px;margin:12px 0 2px;font-family:var(--brand);font-weight:600;font-size:13px;
    box-shadow:0 3px 10px rgba(15,42,71,.28);cursor:pointer;
  }
  .nn-k{background:var(--gold-bright);color:var(--navy);font-weight:800;font-size:10px;letter-spacing:.08em;border-radius:999px;padding:2px 9px;margin-right:8px;text-transform:uppercase;vertical-align:1px}
  @media (prefers-reduced-motion:no-preference){
    @keyframes starpop{0%{transform:scale(1)}45%{transform:scale(1.4) rotate(8deg)}100%{transform:scale(1)}}
    .star.pop{animation:starpop .32s ease}
    .daytab,.chip,.btn{transition:transform .08s ease}
    .daytab:active,.chip:active,.btn:active{transform:scale(.97)}
  }

  /* ---------- Live map markers ---------- */
  #liveMap{height:380px;background:var(--tint)}
  .lm-pin{
    width:26px;height:26px;border-radius:50%;color:#fff;text-align:center;
    font-family:var(--brand);font-weight:700;font-size:12.5px;line-height:23px;
    border:2px solid #fff;box-shadow:0 1px 4px rgba(21,43,64,.45);
  }
  .lm-star{
    width:30px;height:30px;border-radius:50%;background:var(--gold-bright);color:var(--navy);
    font-size:16px;line-height:27px;text-align:center;
    border:2px solid #fff;box-shadow:0 1px 4px rgba(21,43,64,.5);
  }
  .leaflet-popup-content{font-family:var(--utility);font-size:13.5px;line-height:1.45;margin:10px 13px}
  .leaflet-popup-content-wrapper{border-radius:10px}
  .leaflet-container a.gm{color:var(--blue);font-weight:600}

  /* ---------- Paper stars ---------- */
  .paper{position:relative;padding-right:36px}
  .pstar{
    position:absolute;top:7px;right:0;border:none;background:none;cursor:pointer;
    font-size:20px;line-height:1;color:#B9C6D2;padding:2px;
  }
  .pstar[aria-pressed="true"]{color:var(--gold-bright)}
  .pstar:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
  .agpapers .paper{padding-top:2px}
  .aghint{font-family:var(--brand);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:10.5px;color:var(--ink-soft);margin:8px 0 2px}

  /* ---------- Hotel floor plan ---------- */
  .fpchips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
  .chip.fp::before{display:none}
  .fpwrap{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(21,43,64,.06)}
  .fpimg{display:block;width:100%;height:auto}
  .fp-ring{
    position:absolute;width:56px;height:56px;border:3.5px solid var(--gold-bright);border-radius:50%;
    transform:translate(-50%,-50%);box-shadow:0 0 0 4px rgba(255,181,58,.28),0 0 16px rgba(255,181,58,.5);
    pointer-events:none;display:none;
  }
  @media (prefers-reduced-motion:no-preference){
    @keyframes fpPulse{0%{outline:14px solid rgba(255,181,58,.4);outline-offset:0}100%{outline:14px solid rgba(255,181,58,0);outline-offset:14px}}
    .fp-ring.pulse{animation:fpPulse 1s ease-out 2}
  }
  .lvl{font-family:var(--brand);font-weight:700;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--blue);background:rgba(46,119,172,.10);border-radius:5px;padding:2px 6px;margin-left:8px;vertical-align:1px;white-space:nowrap}

  /* ---------- Board ---------- */
  .board .msg{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .board .who{font-family:var(--brand);font-weight:700;font-size:12.5px;color:var(--navy)}
  .board .when{font-size:11px;color:#6B7C8C;margin-left:6px;font-family:var(--utility)}
  .board .txt{font-size:14.5px;margin-top:3px;white-space:pre-wrap;word-wrap:break-word}
  .board input,.board textarea{
    width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;
    padding:9px 12px;font:14.5px var(--utility);color:var(--ink);margin-bottom:8px
  }
  .board textarea{min-height:70px;resize:vertical}
  .board input:focus,.board textarea:focus{outline:2px solid var(--blue);outline-offset:1px}

  /* ---------- Bottom nav ---------- */
  nav.tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--navy);
    padding-bottom:env(safe-area-inset-bottom);border-top:3px solid var(--gold-bright);
  }
  nav.tabs .in{max-width:660px;margin:0 auto;display:flex}
  nav.tabs button{
    flex:1;background:none;border:none;color:#8FA9C0;cursor:pointer;padding:9px 0 8px;
    font-family:var(--brand);font-weight:600;letter-spacing:.05em;font-size:10.5px;
    display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;
  }
  nav.tabs button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  nav.tabs button.on{color:#fff}
  nav.tabs button.on svg{stroke:var(--gold-bright)}
  nav.tabs button.on::after{content:"";position:absolute;top:-3px;left:22%;right:22%;height:3px;background:var(--gold-bright)}
  nav.tabs button:focus-visible{outline:2px solid #fff;outline-offset:-3px}
  .badge{
    position:absolute;top:4px;right:calc(50% - 21px);background:var(--gold-bright);color:var(--navy);
    border-radius:999px;font-size:9.5px;min-width:15px;height:15px;line-height:15px;padding:0 3px;font-family:var(--utility);font-weight:700
  }
  footer{margin:34px 0 8px;text-align:center;font-family:var(--brand);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:10.5px;color:#6B7C8C}
  .hide{display:none !important}
  @media (prefers-reduced-motion:no-preference){
    .card,.poicard{transition:box-shadow .15s ease}
  }
</style>
</head>
<body>
<header class="bill" role="banner">
  <div class="inner">
    <div class="logobox"><img class="logo" src="https://www.atlanticmarketingassociation.com/uploads/1/3/3/7/133733174/atma-logo.png" alt="Atlantic Marketing Association logo" onerror="this.closest('.logobox').classList.add('noimg')"><div class="monogram" aria-hidden="true">AtMA</div></div>
    <div class="assoc">Atlantic Marketing Association</div>
    <h1>51st Annual Conference &middot; Nashville</h1>
    <div class="dates">September 30 to October 3, 2026 &middot; Drury Plaza Hotel Downtown</div>
  </div>
  <svg class="waves" viewBox="0 0 400 64" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 34 C 60 18, 120 50, 200 36 S 340 18, 400 32 L 400 64 L 0 64 Z" fill="#FFB53A" opacity="0.95"/>
    <path d="M0 40 C 65 26, 130 52, 210 40 S 345 24, 400 38 L 400 64 L 0 64 Z" fill="#E8604C" opacity="0.5"/>
    <path d="M0 44 C 70 30, 140 56, 220 44 S 350 30, 400 42 L 400 64 L 0 64 Z" fill="#8FC5EE" opacity="0.5"/>
    <path d="M0 54 C 80 44, 160 62, 240 52 S 360 44, 400 52 L 400 64 L 0 64 Z" fill="#FBF2DF" opacity="1"/>
  </svg>
</header>

<div id="programControls" class="controls">
  <div class="wrap">
    <div class="daytabs" id="dayTabs" role="tablist" aria-label="Conference days"></div>
    <div class="searchrow">
      <input id="q" type="search" placeholder="Search sessions, papers, authors" aria-label="Search sessions, papers, and authors">
    </div>
    <div class="roomchips" id="roomChips" role="group" aria-label="Filter by room"></div>
  </div>

/* ---------------- storage adapter ----------------
   Inside Claude, favorites persist through Claude's artifact storage.
   When this file is hosted on a regular website, favorites persist in
   the visitor's own browser storage. If neither is available, favorites
   last for the current visit only. */
const MEM = {};
const hasClaudeStore = (typeof window !== "undefined") && window.storage && (typeof window.storage.get === "function");
async function kvGet(key){
  if (hasClaudeStore){
    try { const r = await window.storage.get(key, false); return r ? r.value : null; }
    catch(e){ return null; }
  }
  try { return window.localStorage.getItem(key); }
  catch(e){ return (key in MEM) ? MEM[key] : null; }
}
async function kvSet(key, val){
  if (hasClaudeStore){
    try { await window.storage.set(key, val, false); } catch(e){}
    return;
  }
  try { window.localStorage.setItem(key, val); }
  catch(e){ MEM[key] = val; }
}

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function byId(id){ return document.getElementById(id); }
function fmtRange(s){ if (s.timeLabel) return s.timeLabel; return s.noEnd ? s.startLabel : s.startLabel + " to " + s.endLabel; }
function sessionsOf(dayId){ return DATA.sessions.filter(function(s){ return s.day === dayId; }); }
function findSession(id){ return DATA.sessions.find(function(s){ return s.id === id; }); }

/* Conference clock: highlights the current session while the meeting runs. */
function todayId(){
  const now = new Date();
  const stamp = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,"0") + "-" + String(now.getDate()).padStart(2,"0");
  const d = DATA.days.find(function(x){ return x.date === stamp; });
  return d ? d.id : null;
}
function isNow(s){
  const t = todayId();
  if (t !== s.day) return false;
  const now = new Date();
  const m = now.getHours()*60 + now.getMinutes();
  return m >= s.startMin && m < s.endMin;
}

/* ---------------- program rendering ---------------- */
function renderDayTabs(){
  const host = byId("dayTabs");
  host.innerHTML = DATA.days.map(function(d){
    return '<button class="daytab' + (state.day===d.id?" on":"") + '" role="tab" aria-selected="' + (state.day===d.id) + '" data-day="' + d.id + '">' +
      '<span class="d">' + esc(d.short) + '</span><span class="n">' + esc(d.num) + '</span></button>';
  }).join("");
  host.querySelectorAll("button").forEach(function(b){
    b.addEventListener("click", function(){
      state.day = b.getAttribute("data-day");
      state.q = ""; byId("q").value = "";
      renderDayTabs(); renderProgramList();
    });
  });
}
function renderRoomChips(){
  const host = byId("roomChips");
  const rooms = [
    {id:"all", label:"All rooms", cls:"all"},
    {id:"Belle Meade A", label:"Belle Meade A", cls:"rA"},
    {id:"Belle Meade B", label:"Belle Meade B", cls:"rB"},

  ];
  host.innerHTML = rooms.map(function(r){
    return '<button class="chip ' + r.cls + (state.room===r.id?" on":"") + '" data-room="' + esc(r.id) + '">' + esc(r.label) + '</button>';
  }).join("");
  host.querySelectorAll("button").forEach(function(b){

      state.room = b.getAttribute("data-room");

}
function matches(s, q){
  if (!q) return true;
  const hay = [s.code||"", s.title, s.room||"", (s.chair||"")].concat(
    (s.papers||[]).map(function(p){
      return p.t + " " + p.a.map(function(a){ return a.n + " " + (a.af||""); }).join(" ");
    })
  ).join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).every(function(w){ return hay.indexOf(w) !== -1; });
}
function cardHtml(s, showDay){
  const cls = ROOMCLASS[s.room] || "";
  const starred = state.stars.has(s.id);
  const open = state.open.has(s.id);
  const now = isNow(s);
  let h = '<article class="card ' + cls + (s.kind==="event" ? " evt":"") + '" id="card-' + s.id + '">';
  h += '<div class="toprow"><div style="flex:1">';
  h += '<div class="code">' + (s.code ? '<span class="codechip">' + esc(s.code) + '</span>' : "") + esc(fmtRange(s)) + (now ? '<span class="nowtag">Now</span>' : "") + '</div>';
  h += '<h3>' + esc(s.title) + '</h3>';
  h += '<div class="meta">' + (s.room ? roomHtml(s.room) : "") +
       (showDay ? ' &middot; ' + esc(DATA.days.find(function(d){return d.id===s.day;}).long) : "") + '</div>';
  if (s.chair) h += '<div class="meta" style="margin-top:2px">Chair: ' + esc(s.chair) + '</div>';
  if (s.note) h += '<div class="note" style="margin-top:5px">' + esc(s.note) + '</div>';
  if (s.link) h += '<div class="btnrow" style="margin-top:8px"><a class="btn ghost" style="padding:7px 12px;font-size:12px" href="' + esc(s.link.url) + '" target="_blank" rel="noopener">' + esc(s.link.label) + '</a></div>';
  h += '</div>';
  if (s.starrable !== false){
    h += '<button class="star" data-star="' + s.id + '" aria-pressed="' + starred + '" aria-label="' +
      (starred ? "Remove from my agenda: " : "Add to my agenda: ") + esc(s.title) + '">' + (starred ? "\u2605" : "\u2606") + '</button>';
  }
  h += '</div>';
  if (s.papers && s.papers.length){
    h += '<button class="expander" data-open="' + s.id + '" aria-expanded="' + open + '">' +
         (open ? "Hide papers" : "Show " + s.papers.length + (s.papers.length===1?" paper":" papers")) + ' \u25BE</button>';
    h += '<div class="papers' + (open?"":" hide") + '" id="papers-' + s.id + '">';
    s.papers.forEach(function(p){
      const ps = p.sub && state.pstars.has(p.sub);
      h += '<div class="paper">';
      if (p.sub){
        h += '<button class="pstar" data-pstar="' + esc(p.sub) + '" aria-pressed="' + (ps ? "true" : "false") +
             '" aria-label="' + (ps ? "Remove paper from my agenda" : "Add paper to my agenda") + '">' +
             (ps ? "\u2605" : "\u2606") + '</button>';
      }
      h += '<div class="pt">' + esc(p.t) + '</div>';
      h += '<div class="pa">' + p.a.map(function(a){
        let line = esc(a.n) + (a.af ? ", " + esc(a.af) : "");
        if (CONFIG.showEmails && a.e) line += " &middot; " + esc(a.e);
        return line;
      }).join("<br>") + '</div>';
      if (p.sub) h += '<div class="ps">Submission ' + esc(p.sub) + '</div>';
      h += '</div>';
    });
    h += '</div>';
  }
  h += '</article>';
  return h;
}

    if (i > -1) selectPoi(i);
  }, 0);
}

function wireCards(root){
  root.querySelectorAll("[data-roomlink]").forEach(function(b){
    b.addEventListener("click", function(e){
      e.stopPropagation();
      const v = b.getAttribute("data-roomlink");
      if (v.indexOf("fp:") === 0) showRoomOnMap(v.slice(3));
      else if (v.indexOf("poi:") === 0) showPoiOnMap(v.slice(4));
    });
  });
  root.querySelectorAll("[data-star]").forEach(function(b){
    b.addEventListener("click", function(){
      const id = b.getAttribute("data-star");
      if (state.stars.has(id)) state.stars.delete(id); else state.stars.add(id);
      kvSet("atma26:stars", JSON.stringify(Array.from(state.stars)));
      updateBadge();
      const starred = state.stars.has(id);
      b.setAttribute("aria-pressed", String(starred));
      b.textContent = starred ? "\u2605" : "\u2606";
      b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
      const s = findSession(id);
      b.setAttribute("aria-label", (starred ? "Remove from my agenda: " : "Add to my agenda: ") + s.title);
      if (state.tab === "agenda") renderAgenda();
    });
  });
  root.querySelectorAll("[data-pstar]").forEach(function(b){
    b.addEventListener("click", function(){
      const id = b.getAttribute("data-pstar");
      if (state.pstars.has(id)) state.pstars.delete(id); else state.pstars.add(id);
      kvSet("atma26:pstars", JSON.stringify(Array.from(state.pstars)));
      updateBadge();
      const on = state.pstars.has(id);
      b.setAttribute("aria-pressed", String(on));
      b.setAttribute("aria-label", on ? "Remove paper from my agenda" : "Add paper to my agenda");
      b.textContent = on ? "\u2605" : "\u2606";
      b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
      if (state.tab === "agenda") renderAgenda();
    });
  });
  root.querySelectorAll("[data-open]").forEach(function(b){
    b.addEventListener("click", function(){
      const id = b.getAttribute("data-open");
      const box = byId("papers-" + id);
      const s = findSession(id);
      if (state.open.has(id)){ state.open.delete(id); box.classList.add("hide"); b.setAttribute("aria-expanded","false");
        b.innerHTML = "Show " + s.papers.length + (s.papers.length===1?" paper":" papers") + " \u25BE"; }
      else { state.open.add(id); box.classList.remove("hide"); b.setAttribute("aria-expanded","true");
        b.innerHTML = "Hide papers \u25BE"; }
    });
  });
}
function renderNowBanner(){
  const host = byId("nowBanner");
  if (!host) return;
  const t = todayId();
  if (!t){ host.innerHTML = ""; return; }
  const dnow = new Date();
  const m = dnow.getHours() * 60 + dnow.getMinutes();
  const today = sessionsOf(t);
  const cur = today.filter(function(s){ return s.kind === "session" && s.startMin <= m && m < s.endMin; });
  const nxt = today.filter(function(s){ return s.kind === "session" && s.startMin > m; });
  let h = "";
  if (cur.length){
    h = '<span class="nn-k">Now</span>Sessions ' + cur.map(function(s){ return esc(s.code); }).join(", ") + " until " + esc(cur[0].endLabel);
  } else if (nxt.length){
    const first = nxt[0].startMin;
    const batch = nxt.filter(function(s){ return s.startMin === first; });
    h = '<span class="nn-k">Next</span>Sessions ' + batch.map(function(s){ return esc(s.code); }).join(", ") + " at " + esc(batch[0].startLabel);
  }
  if (!h){ host.innerHTML = ""; return; }
  host.innerHTML = '<div class="nownext" role="button" tabindex="0">' + h + ' \u00b7 tap to see today</div>';
  const el = host.firstChild;
  function go(){ state.day = t; renderDayTabs(); renderProgramList(); }
  el.addEventListener("click", go);
  el.addEventListener("keydown", function(e){ if (e.key === "Enter" || e.key === " "){ e.preventDefault(); go(); } });
}

function renderProgramList(){
  const host = byId("programList");
  if (!host) return;
  let list, heading = "";
  if (state.q.trim()){
    list = DATA.sessions.filter(function(s){ return matches(s, state.q.trim()); });
    heading = '<div class="dayhead">' + list.length + (list.length===1?" result":" results") + ' across all days</div>';
  } else {
    list = sessionsOf(state.day);
    const d = DATA.days.find(function(x){ return x.id===state.day; });
    heading = '<div class="dayhead">' + esc(d.long) + '</div>';
  }
  if (state.room !== "all"){
    list = list.filter(function(s){ return s.room === state.room || s.kind !== "session"; });
  }
  let h = heading;
  if (!list.length){
    h += '<div class="empty">Nothing matches. Try another search term or filter.</div>';
  } else {
    let lastTime = null;
    list.forEach(function(s){
      const t = s.startLabel;
      if (!state.q.trim() && t !== lastTime){
        const bc = list.filter(function(x){ return x.startLabel === t && x.kind === "session"; }).length;
        h += '<div class="timehead"><span class="t">' + esc(t) + '</span>' +
             (bc ? '<span class="c">' + bc + (bc === 1 ? ' session' : ' sessions') + '</span>' : '') +
             '<span class="l"></span></div>';
        lastTime = t;
      }
      h += cardHtml(s, !!state.q.trim());
    });
  }
  host.innerHTML = h;
  wireCards(host);
}
function renderProgram(){
  byId("programControls").classList.remove("hide");
  byId("view").innerHTML = '<div id="nowBanner"></div><div id="programList"></div>';
  renderDayTabs(); renderRoomChips(); renderNowBanner(); renderProgramList();
}

/* ---------------- my agenda ---------------- */
function starredPapersOf(s){
  return s.papers.filter(function(p){ return p.sub && state.pstars.has(p.sub); });
}
function renderAgenda(){
  byId("programControls").classList.add("hide");
  const starred = DATA.sessions.filter(function(s){
    return state.stars.has(s.id) || starredPapersOf(s).length;
  });
  let h = '<div class="sec"><h2>My Agenda</h2>';
  if (!starred.length){
    h += '<div class="empty">Nothing starred yet.<br>Tap the \u2606 on any session, or on an individual paper inside a session, to build your personal schedule.</div></div>';
    byId("view").innerHTML = h;
    return;
  }
  h += '<p class="note">Starred sessions and papers are saved on this device and grouped by day.</p>';
  DATA.days.forEach(function(d){
    const todays = starred.filter(function(s){ return s.day === d.id; });
    if (!todays.length) return;
    h += '<div class="dayhead">' + esc(d.long) + '</div>';
    todays.forEach(function(s){
      h += cardHtml(s, false);
      const sp = starredPapersOf(s);
      if (sp.length){
        let ph = '<div class="aghint">Starred papers in ' + (s.code ? esc(s.code) : "this session") + '</div>';
        ph += '<div class="papers agpapers">';
        sp.forEach(function(p){
          ph += '<div class="paper"><button class="pstar" data-pstar="' + esc(p.sub) + '" aria-pressed="true" aria-label="Remove paper from my agenda">\u2605</button>';
          ph += '<div class="pt">' + esc(p.t) + '</div>';
          ph += '<div class="pa">' + p.a.map(function(a){ return esc(a.n); }).join(", ") + '</div></div>';
        });
        ph += '</div>';
        h = h.slice(0, h.lastIndexOf("</div>")) + ph + "</div>";
      }
    });
  });
  h += '<div class="btnrow"><button class="btn" id="icsBtn">Add starred to calendar (.ics)</button></div>';
  h += '<p class="note" style="margin-top:8px">The calendar file uses Nashville local times.</p></div>';
  byId("view").innerHTML = h;
  wireCards(byId("view"));
  byId("icsBtn").addEventListener("click", downloadIcs);
}
function icsStamp(date, hm){
  return date.replace(/-/g,"") + "T" + hm.replace(":","") + "00";
}
function plusHour(hm){
  const p = hm.split(":");
  return String((Number(p[0]) + 1) % 24).padStart(2, "0") + ":" + p[1];
}
function downloadIcs(){
  const starred = DATA.sessions.filter(function(s){ return state.stars.has(s.id) || starredPapersOf(s).length; });
  const lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//AtMA//2026 Nashville//EN","CALSCALE:GREGORIAN"];
  starred.forEach(function(s){
    const d = DATA.days.find(function(x){ return x.id===s.day; });
    lines.push("BEGIN:VEVENT");
    lines.push("UID:atma2026-" + s.id + "@atlanticmarketingassociation.com");
    lines.push("DTSTART:" + icsStamp(d.date, s.start));
    lines.push("DTEND:" + icsStamp(d.date, s.noEnd ? plusHour(s.start) : s.end));
    lines.push("SUMMARY:" + (s.code ? s.code + " " : "") + s.title.replace(/[,;]/g," "));
    lines.push("LOCATION:" + (s.room ? s.room + " · " : "") + "Drury Plaza Hotel Nashville Downtown");
    const sp = starredPapersOf(s);
    const desc = [];
    if (s.timeLabel) desc.push("Time approximate: " + s.timeLabel.toLowerCase() + ", about 30 minutes after it ends.");
    else if (s.noEnd) desc.push("End time not listed in the program; a one hour block is shown.");
    if (sp.length) desc.push("Starred papers: " + sp.map(function(p){ return p.t.replace(/[,;\\]/g," "); }).join(" | "));
    if (desc.length) lines.push("DESCRIPTION:" + desc.join("  "));
    lines.push("END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  const text = lines.join("\r\n");
  try {
    const blob = new Blob([text], {type:"text/calendar"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "atma-2026-agenda.ics";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 400);
  } catch(e){
    window.prompt("Copy this calendar text and save it as atma-2026-agenda.ics", text);
  }
}

  {n:"Old Hickory", x:89.2, y:34.6, c:"var(--grey)"},

function wireFloorplan(){
  const chips = byId("fpChips"), ring = byId("fpRing");
  if (!chips || !ring) return;
  chips.innerHTML = FLOORROOMS.map(function(r, i){
    return '<button class="chip fp" data-fp="' + i + '" aria-label="Show ' + esc(r.n) + ' on the floor plan">' +
           '<span class="dot" style="background:' + r.c + '"></span>' + esc(r.n) + '</button>';
  }).join("");
  chips.querySelectorAll("[data-fp]").forEach(function(bt){
    bt.addEventListener("click", function(){
      const r = FLOORROOMS[Number(bt.getAttribute("data-fp"))];
      chips.querySelectorAll(".chip").forEach(function(c){ c.classList.toggle("on", c === bt); });
      ring.style.left = r.x + "%";
      ring.style.top = r.y + "%";
      ring.style.display = "block";
      ring.classList.remove("pulse"); void ring.offsetWidth; ring.classList.add("pulse");
    });
  });
}

function renderHotel(){
  byId("programControls").classList.add("hide");
  let h = "";
  h += '<div class="sec roomguide"><h2>Inside the Hotel</h2>';
  h += '<p class="note">Tap a room name to spot it on the hotel floor plan.</p>';
  h += '<div class="fpchips" id="fpChips"></div>';
  h += '<div class="fpwrap"><img class="fpimg" src="' + FLOORPLAN + '" alt="Floor plan of the Drury Plaza Hotel meeting levels showing the Lower Level session rooms, the Main Level boardroom, and the Amenity Level dining"><div class="fp-ring" id="fpRing"></div></div>';
  h += '<p class="note" style="margin-top:8px">Sessions and registration are on the Lower Level. The daytime Networking Room is on the Main Level. The hotel\u2019s complimentary breakfast is served in Guest Dining on the Amenity Level, and the Friday awards luncheon takes place off site at Martin\u2019s Bar-B-Que Joint, found on the Explore tab. Floor plan courtesy of Drury Hotels.</p>';
  DATA.rooms.forEach(function(r){
    const cls = ROOMCLASS[r.name] || "";
    h += '<div class="rg"><div class="rn"><span class="dot" style="background:' + ROOMCOLOR[cls] + '"></span>' + esc(r.name) +
         (r.level ? '<span class="lvl">' + esc(r.level) + '</span>' : '') + '</div>' +
         '<div class="ru">' + esc(r.use) + '</div></div>';
  });
  h += '</div>';

  byId("view").innerHTML = h;
  wireFloorplan();
}

function renderExplore(){
  byId("programControls").classList.add("hide");
  let h = '<div class="sec"><h2>Around the Hotel</h2>';
  h += '<p class="note">Numbered markers show places near the Drury Plaza Hotel Nashville Downtown, 300 Korean Veterans Blvd. Filter by category, then tap a marker or a legend entry for details and one tap walking directions. Distances are straight line from the hotel.</p>';
  h += '<div class="fpchips" id="mapCats"></div>';
  h += '<div id="liveMapWrap" class="mapbox" style="padding:0;overflow:hidden;position:relative;z-index:1"><div id="liveMap"></div></div>';
  h += '<div id="svgWrap" class="mapbox hide"><svg id="poiSvg" viewBox="0 0 400 420" role="img" aria-label="Schematic map of landmarks near the conference hotel"></svg></div>';
  h += '<div id="mapNote"></div>';
  h += '<ol class="legend" id="poiLegend"></ol>';
  h += '<div id="poiDetail"></div>';
  h += '</div>';

  h += '<div class="sec"><h2>Conference GIS Layer</h2>';
  if (CONFIG.arcgisEmbedUrl){
    h += '<div class="mapbox" style="padding:0;overflow:hidden"><iframe src="' + esc(CONFIG.arcgisEmbedUrl) + '" style="width:100%;height:420px;border:0" title="ArcGIS map" loading="lazy" allowfullscreen></iframe></div>';
    h += '<p class="note" style="margin-top:8px">Powered by ArcGIS Online.</p>';
  } else {
    h += '<p class="note">A curated ArcGIS Online map or StoryMap from the conference team can be embedded here. Paste the embed link into the app settings and it will appear in this space.</p>';
  }
  h += '</div>';
  byId("view").innerHTML = h;
  wireMapCats();
  renderLegend();
  initLiveMap();
  selectPoi(state.poi, {scroll:false});
}

function wireMapCats(){
  const host = byId("mapCats");
  if (!host) return;
  const cats = [["all","All places",null],["museum",CATLABEL.museum,CATCOLOR.museum],["sight",CATLABEL.sight,CATCOLOR.sight],["food",CATLABEL.food,CATCOLOR.food],["music",CATLABEL.music,CATCOLOR.music]];
  host.innerHTML = cats.map(function(c){
    return '<button class="chip fp' + (state.mapcat === c[0] ? " on" : "") + '" data-mapcat="' + c[0] + '">' +
           (c[2] ? '<span class="dot" style="background:' + c[2] + '"></span>' : "") + c[1] + '</button>';
  }).join("");
  host.querySelectorAll("[data-mapcat]").forEach(function(bt){
    bt.addEventListener("click", function(){
      state.mapcat = bt.getAttribute("data-mapcat");
      if (state.poi != null && DATA.pois[state.poi] && !poiVisible(DATA.pois[state.poi])) state.poi = null;
      renderExplore();
    });
  });
}

/* Live street map: Leaflet with the OpenStreetMap basemap. If the library or
   the map tiles cannot load, for example fully offline, the built in schematic
   view takes over automatically. */
var LIVEMAP = null, LIVEMARKERS = [];
function activateSchematic(reason){
  if (LIVEMAP){ try{ LIVEMAP.remove(); }catch(e){} LIVEMAP = null; }
  LIVEMARKERS = [];
  var lw = byId("liveMapWrap"), sw = byId("svgWrap");
  if (!lw || !sw) return;
  lw.classList.add("hide");
  sw.classList.remove("hide");
  drawPoiSvg();
  if (reason === "tiles" && byId("mapNote")){
    byId("mapNote").innerHTML = '<p class="note" style="margin-top:8px">The street map could not load in this window, so the schematic view is shown. The hosted version of this page displays the full interactive street map.</p>';
  }
}
function initLiveMap(){
  LIVEMARKERS = [];
  if (state.tab !== "explore" || !byId("liveMap")) return;
  if (typeof L === "undefined"){
    if (document.readyState === "complete"){ activateSchematic("no-lib"); }
    else { setTimeout(initLiveMap, 250); }
    return;
  }
  if (LIVEMAP){ try{ LIVEMAP.remove(); }catch(e){} LIVEMAP = null; }
  try{
    LIVEMAP = L.map("liveMap", { scrollWheelZoom: true });
    LIVEMAP.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');
    var loaded = 0, failed = 0;
    var tiles = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'
    });
    tiles.on("tileload", function(){ loaded++; });
    tiles.on("tileerror", function(){ failed++; });
    setTimeout(function(){ if (loaded === 0 && failed > 0) activateSchematic("tiles"); }, 4000);
    tiles.addTo(LIVEMAP);
    var hotel = DATA.hotel;
    var star = L.divIcon({ className: "", html: '<div class="lm-star">\u2605</div>', iconSize: [30,30], iconAnchor: [15,15] });
    L.marker([hotel.lat, hotel.lng], { icon: star, title: hotel.name, zIndexOffset: 500 })
      .addTo(LIVEMAP)
      .bindPopup('<strong>' + esc(hotel.name) + '</strong><br>Conference venue \u00b7 300 Korean Veterans Blvd');
    var pts = [[hotel.lat, hotel.lng]];
    DATA.pois.forEach(function(p, i){
      if (!poiVisible(p)) return;
      var col = CATCOLOR[p.cat] || "#2E77AC";
      var icon = L.divIcon({ className: "", html: '<div class="lm-pin" style="background:' + col + '">' + (i+1) + '</div>', iconSize: [26,26], iconAnchor: [13,13] });
      var mk = L.marker([p.lat, p.lng], { icon: icon, title: p.name }).addTo(LIVEMAP);
      mk.bindPopup('<strong>' + esc(p.name) + '</strong><br>' + p.mi.toFixed(2) + ' mi from the hotel');
      mk.on("click", function(){ selectPoi(i, {scroll:false}); });
      LIVEMARKERS[i] = mk;
      pts.push([p.lat, p.lng]);
    });
    LIVEMAP.fitBounds(L.latLngBounds(pts).pad(0.12));
  } catch(e){
    activateSchematic("tiles");
  }
}

function drawPoiSvg(){
  const svg = byId("poiSvg");
  const G = DATA.geo;
  const cx = 200, cy = 210;
  let s = "";
  /* rings */
  [0.25, 0.5].forEach(function(mi){
    const r = mi * G.scale;
    s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="#C6D4E0" stroke-width="1" stroke-dasharray="3 4"/>';
    s += '<text x="' + cx + '" y="' + (cy - r - 4) + '" text-anchor="middle" font-family="Libre Franklin, Segoe UI, Arial, sans-serif" font-size="9.5" letter-spacing="1.5" fill="#8CA0B2">' + (mi===0.25 ? "1/4 MI" : "1/2 MI") + '</text>';
  });
  /* Broadway alignment between two verified addresses on Broadway */
  if (G.broadway){
    s += '<line x1="' + G.broadway.x1 + '" y1="' + G.broadway.y1 + '" x2="' + G.broadway.x2 + '" y2="' + G.broadway.y2 + '" stroke="#8CA0B2" stroke-width="2.5" stroke-dasharray="6 5" opacity="0.6"/>';
    s += '<text x="' + G.broadway.lx + '" y="' + G.broadway.ly + '" font-family="Libre Franklin, Segoe UI, Arial, sans-serif" font-size="10.5" letter-spacing="2.5" fill="#5A6B7C" transform="rotate(' + G.broadway.rot + ' ' + G.broadway.lx + ' ' + G.broadway.ly + ')">BROADWAY</text>';
  }
  /* north arrow */
  s += '<g transform="translate(372,26)"><path d="M0 10 L0 -8" stroke="#1E4468" stroke-width="1.6"/><path d="M-4 -3 L0 -10 L4 -3" fill="#1E4468"/><text x="0" y="24" text-anchor="middle" font-family="Libre Franklin, Segoe UI, Arial, sans-serif" font-size="10" letter-spacing="1" fill="#1E4468">N</text></g>';
  /* scale bar */
  const sb = 0.25 * G.scale;
  s += '<g transform="translate(18,400)"><line x1="0" y1="0" x2="' + sb + '" y2="0" stroke="#1E4468" stroke-width="2"/><line x1="0" y1="-4" x2="0" y2="4" stroke="#1E4468" stroke-width="2"/><line x1="' + sb + '" y1="-4" x2="' + sb + '" y2="4" stroke="#1E4468" stroke-width="2"/><text x="' + (sb/2) + '" y="-7" text-anchor="middle" font-family="Libre Franklin, Segoe UI, Arial, sans-serif" font-size="9.5" letter-spacing="1.5" fill="#1E4468">1/4 MILE</text></g>';
  /* hotel */
  s += '<g><path transform="translate(' + cx + ',' + cy + ') scale(1.15)" d="M0 -9 L2.4 -2.8 L9 -2.8 L3.6 1.4 L5.6 8 L0 4.2 L-5.6 8 L-3.6 1.4 L-9 -2.8 L-2.4 -2.8 Z" fill="#FFB53A" stroke="#1E4468" stroke-width="1.4"/>';
  s += '<text x="' + cx + '" y="' + (cy + 24) + '" text-anchor="middle" font-family="Libre Franklin, Segoe UI, Arial, sans-serif" font-weight="700" font-size="11" letter-spacing="1.5" fill="#1E4468">DRURY PLAZA</text></g>';
  /* pois */
  DATA.pois.forEach(function(p, i){
    if (!poiVisible(p)) return;
    const col = CATCOLOR[p.cat] || "#2E77AC";
    s += '<g class="poi-dot" data-poi="' + i + '" role="button" tabindex="0" aria-label="' + esc(p.name) + '">' +
      '<circle class="halo" cx="' + p.x + '" cy="' + p.y + '" r="15"/>' +
      '<circle class="core" cx="' + p.x + '" cy="' + p.y + '" r="9.5" fill="' + col + '" stroke="#FFFFFF" stroke-width="1.5"/>' +
      '<text x="' + p.x + '" y="' + (p.y + 3.6) + '" text-anchor="middle" font-family="Libre Franklin, Segoe UI, Arial, sans-serif" font-weight="700" font-size="10.5" fill="#fff">' + (i+1) + '</text></g>';
  });
  svg.innerHTML = s;
  svg.querySelectorAll(".poi-dot").forEach(function(g){
    const idx = Number(g.getAttribute("data-poi"));
    g.addEventListener("click", function(){ selectPoi(idx); });
    g.addEventListener("keydown", function(ev){ if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); selectPoi(idx); } });
  });
}
function renderLegend(){
  const host = byId("poiLegend");
  host.innerHTML = DATA.pois.map(function(p, i){
    if (!poiVisible(p)) return "";
    const col = CATCOLOR[p.cat] || "#2E77AC";
    return '<li data-poi="' + i + '"><span class="num" style="background:' + col + '">' + (i+1) + '</span>' +
      '<span class="nm">' + esc(p.name) + '</span><span class="ds">' + p.mi.toFixed(2) + ' mi</span></li>';
  }).join("");
  host.querySelectorAll("li").forEach(function(li){
    li.addEventListener("click", function(){ selectPoi(Number(li.getAttribute("data-poi"))); });
  });
}
function selectPoi(idx, opts){
  const det = byId("poiDetail");
  if (!det) return;
  if (idx == null || !DATA.pois[idx]){ det.innerHTML = ""; return; }
  state.poi = idx;
  const p = DATA.pois[idx];
  document.querySelectorAll(".poi-dot").forEach(function(g){
    g.classList.toggle("sel", Number(g.getAttribute("data-poi")) === idx);
  });
  if (LIVEMAP && LIVEMARKERS[idx]){
    LIVEMAP.panTo(LIVEMARKERS[idx].getLatLng());
    LIVEMARKERS[idx].openPopup();
  }
  const g = "https://www.google.com/maps/dir/?api=1&destination=" + p.lat + "%2C" + p.lng +
            (p.pid ? "&destination_place_id=" + encodeURIComponent(p.pid) : "") + "&travelmode=walking";
  const a = "https://maps.apple.com/?daddr=" + p.lat + "%2C" + p.lng + "&dirflg=w";
  det.innerHTML =
    '<div class="poicard"><div class="cat">' + (CATLABEL[p.cat] || "") + ' &middot; ' + p.mi.toFixed(2) + ' mi straight line' + (p.rating ? ' &middot; ' + p.rating.toFixed(1) + ' on Google' : '') + '</div>' +
    '<h3>' + esc(p.name) + '</h3><p>' + esc(p.blurb) + '</p>' +
    '<div class="btnrow"><a class="btn" href="' + g + '" target="_blank" rel="noopener">Walking directions \u00b7 Google</a>' +
    '<a class="btn ghost" href="' + a + '" target="_blank" rel="noopener">Apple Maps</a></div></div>';
  if (!(opts && opts.scroll === false) && det.scrollIntoView){
    det.scrollIntoView({behavior:"smooth", block:"nearest"});
  }
}

/* Community board: available when the app runs inside Claude. */
async function renderBoard(){
  const host = byId("boardHost");
  if (!host) return;
  if (!hasClaudeStore){
    if (!CONFIG.chatLinks.length){
      host.innerHTML = '<p class="note" style="margin-top:12px">A group chat link for attendees can be added here by the conference team.</p>';
    }
    return;
  }
  host.innerHTML = '<div class="board" style="margin-top:16px">' +
    '<h2 style="font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.14em;font-size:13px;margin-bottom:6px">Message Board</h2>' +
    '<p class="note" style="margin-bottom:8px">Posts here are visible to everyone who opens this app. Keep it collegial.</p>' +
    '<input id="bName" maxlength="40" placeholder="Your name" aria-label="Your name">' +
    '<textarea id="bText" maxlength="400" placeholder="Share a note, a question, or a dinner plan" aria-label="Message"></textarea>' +
    '<div class="btnrow" style="margin-top:0"><button class="btn" id="bPost">Post</button><button class="btn ghost" id="bRefresh">Refresh</button></div>' +
    '<div id="bList" style="margin-top:12px"><p class="note">Loading messages...</p></div></div>';
  byId("bPost").addEventListener("click", postBoard);
  byId("bRefresh").addEventListener("click", loadBoard);
  loadBoard();
}
async function loadBoard(){
  const list = byId("bList");
  if (!list) return;
  try{
    const r = await window.storage.list("atma26board:", true);
    const keys = (r && r.keys) ? r.keys.slice() : [];
    keys.sort(); keys.reverse();
    const top = keys.slice(0, 50);
    const vals = await Promise.all(top.map(function(k){
      return window.storage.get(k, true).catch(function(){ return null; });
    }));
    const msgs = vals.filter(Boolean).map(function(v){
      try { return JSON.parse(v.value); } catch(e){ return null; }
    }).filter(Boolean);
    if (!msgs.length){ list.innerHTML = '<p class="note">No posts yet. Start the conversation.</p>'; return; }
    list.innerHTML = msgs.map(function(m){
      const when = m.ts ? new Date(m.ts).toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}) : "";
      return '<div class="msg"><span class="who">' + esc(m.n) + '</span><span class="when">' + esc(when) + '</span><div class="txt">' + esc(m.t) + '</div></div>';
    }).join("");
  } catch(e){
    list.innerHTML = '<p class="note">The message board could not load right now.</p>';
  }
}
async function postBoard(){
  const nameEl = byId("bName"), textEl = byId("bText");
  const n = nameEl.value.trim(), t = textEl.value.trim();
  if (!n || !t){ alert("Please add your name and a message."); return; }
  const ts = Date.now();
  const key = "atma26board:" + ts + "-" + Math.floor(Math.random()*100000);
  try{
    await window.storage.set(key, JSON.stringify({n:n.slice(0,40), t:t.slice(0,400), ts:ts}), true);
    textEl.value = "";
    loadBoard();
  } catch(e){
    alert("The post could not be saved. Please try again.");
  }
}

/* ---------------- navigation ---------------- */
function updateBadge(){
  const b = byId("agendaBadge");
  const n = state.stars.size + state.pstars.size;
  b.textContent = String(n);
  b.classList.toggle("hide", n === 0);
}
function setTab(t){
  state.tab = t;
  ["program","agenda","hotel","explore","info"].forEach(function(x){
    byId("tab-" + x).classList.toggle("on", x === t);
  });
  if (t === "program") renderProgram();
  else if (t === "agenda") renderAgenda();
  else if (t === "hotel") renderHotel();
  else if (t === "explore") renderExplore();
  else renderInfo();
  window.scrollTo({top: t === "program" ? Math.min(window.scrollY, 0) : 0});
  byId("view").focus({preventScroll:true});
}

async function init(){
  try{
    const raw = await kvGet("atma26:stars");
    if (raw){ JSON.parse(raw).forEach(function(id){ state.stars.add(id); }); }
  } catch(e){}
  state.stars = new Set(Array.from(state.stars).filter(function(id){
    return DATA.sessions.some(function(s){ return s.id === id; });
  }));
  try{
    const praw = await kvGet("atma26:pstars");
    if (praw){ JSON.parse(praw).forEach(function(id){ state.pstars.add(id); }); }
  } catch(e){}
  const validSubs = {};
  DATA.sessions.forEach(function(s){ s.papers.forEach(function(p){ if (p.sub) validSubs[p.sub] = true; }); });
  state.pstars = new Set(Array.from(state.pstars).filter(function(id){ return validSubs[id]; }));
  const t = todayId();
  if (t && t !== "wed") state.day = t;
  else if (t === "wed") state.day = "wed";
  updateBadge();
  byId("tab-program").addEventListener("click", function(){ setTab("program"); });
  byId("tab-agenda").addEventListener("click", function(){ setTab("agenda"); });
  byId("tab-hotel").addEventListener("click", function(){ setTab("hotel"); });
  byId("tab-explore").addEventListener("click", function(){ setTab("explore"); });
  byId("tab-info").addEventListener("click", function(){ setTab("info"); });
  byId("q").addEventListener("input", function(e){
    state.q = e.target.value;
    renderProgramList();
  });
  renderProgram();
}
init();
</script>
